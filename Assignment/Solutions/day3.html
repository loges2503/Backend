console.log("problem 2");
      function createAccount() {
        let balances = 1000;
        function deposit(amount) {
          balances += amount;
        }
        function getBalance() {
          console.log(balances);
        }
        return {
          deposit,
          getBalance,
        };
      }

      let accounts = createAccount();

      accounts.deposit(500);

      console.log("problem 3");

      function createCounter() {
        let count = 0;

        function increment() {
          count++;
        }

        function decrement() {
          count--;
        }

        function getCount() {
          console.log("Counter:", count);
        }

        return {
          increment,
          decrement,
          getCount,
        };
      }

      const counter = createCounter();

      counter.increment();
      counter.increment();
      counter.increment();

      counter.decrement();

      counter.getCount();

      let count = 100;

      console.log("Outside Count:", count);

      counter.getCount();

      function createEmployee(name, initialSalary) {
        let salary = initialSalary;

        function getName() {
          return name;
        }
        function getSalary() {
          return salary;
        }
        function increaseSalary($amount) {
          if ($amount > 0) {
            salary += $amount;
          } else {
            console.log("cant increase negative salary");
          }

          console.log("Increased Salary", salary);
        }
        return {
          getName,
          getSalary,
          increaseSalary,
        };
      }
      let employee = createEmployee("Arun", 25000);
      employee.increaseSalary(5000);

      console.log(employee.getName());

      console.log(employee.getSalary());

      let salary = 100000;

      console.log("Outside Salary:", salary);

      console.log("Employee Salary:", employee.getSalary());
