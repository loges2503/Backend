<body>
   <h1>Asyc and Sync</h1>
<h3>Syntax of promise </h3>   
<h3>const promise = new Promise((resolve,reject)=>{ <br>
    let success = true;<br>
    if(success){<br>
        resolve("Success"){<br>
            
        }else{<br>
            reject("Failed")<br>
        }<br>
    });<br>
</h3> 
<h3>syntax of async/await</h3>
<h3>const functionName =async ()=>{ <br>
    const result = await promise;<br>
};
</h3>

   <script>
    // Task one
    function calculate(num1,num2,callback){  // here callback is argument 
        let add = num1+num2;
        callback(add)
    }
    function second(add){ //here add is a parameter to store that value
        
        console.log("task one output: ",add)
    }
    calculate(10,20,second) 

    // task two
    
    
    const checkNumber = (number)=>{
        return new Promise((resolve,reject)=>{
            if(number >=10){
                resolve("Valid Number")
            }else{
                reject("Invalid Number")
            }
        });
    };
    checkNumber(20)
    .then((result)=>{
        console.log("two: ",result );
        
    })
    .catch((error)=>{
        console.log(error);
        
    });


    // task three
   
    
    const verifyNumber = async () => {

try {

const result = await checkNumber(20);

console.log("three : ",result);


} catch (error) {

console.log("error");


}

};

verifyNumber();


    
    

   </script> 
</body>
